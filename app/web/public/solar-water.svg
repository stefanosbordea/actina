  <use href="#solarPanel" x="199" y="221"/>
  <use href="#solarPanel" x="64" y="299"/>
  <use href="#solarPanel" x="203" y="379"/>
  <circle cx="160" cy="95" r="20" fill="url(#sun)"/>
  <circle cx="160" cy="95" r="28" stroke="#efb85f" stroke-opacity=".2"/>
  <g stroke="#e7b763" stroke-linecap="round">
    <path d="m142 131-18 54m60-55 27 45m-61-15-17 48" stroke-width="1.3" opacity=".38"/>
    <path d="m121 103-8 3m69-49 4-8m11 54 9 3M158 59l-1-9" opacity=".5"/>
  </g>

  <!-- Desalination skid and its pressure vessels. -->
  <path d="m474 403 139 80 116-67-140-80Z" fill="#0a0d12" opacity=".6"/>
  <path d="m480 395 136 78v21l-136-78Z" fill="#151e27" stroke="#46515b" stroke-width=".8"/>
  <path d="m616 473 106-62v21l-106 62Z" fill="#10171f" stroke="#4f6674" stroke-width=".8"/>
  <path d="m480 395 106-62 136 78-106 62Z" fill="url(#base)" stroke="#677d8c" stroke-width="1"/>
  <path d="m495 396 91-52 121 69-91 52Z" stroke="#627989" stroke-opacity=".35"/>
  <g stroke="#647685" stroke-width="3">
    <path d="M515 319v75m66-113v76m113-6v62m-65-25v64"/>
    <path d="m515 376 66-38 113 65m-179-61 113 65 66-38"/>
  </g>
  <g stroke="#acc1cc" stroke-width=".8" opacity=".7">
    <path d="M513 319v75m66-113v76m113-6v62m-65-25v64"/>
  </g>
  <use href="#membrane" transform="matrix(.82 .475 0 1 580 269)"/>
  <use href="#membrane" transform="matrix(.82 .475 0 1 548 287)"/>
  <use href="#membrane" transform="matrix(.82 .475 0 1 516 305)"/>
  <path d="m511 305-12-7v43l61 35m-14-89-47 27m78-45-78 45" stroke="#477189" stroke-width="4" stroke-linejoin="round"/>
  <path d="m630 371 63-36v48l-26 15" stroke="#60b4d6" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="m663 351 30 17" stroke="#60b4d6" stroke-width="3.5"/>

  <!-- Motor, pump and a small local control enclosure. -->
  <path d="m520 380 29-17 45 26-29 17Z" fill="#485a68" stroke="#7f96a5"/>
  <path d="M520 380v25l45 26v-25Z" fill="#24333f" stroke="#5a7181"/>
  <path d="m565 406 29-17v25l-29 17Z" fill="#142c3b" stroke="#54798e"/>
  <path d="m526 386 31 18m-31-11 31 18m-31-11 31 18" stroke="#7a8c98" stroke-width="1.5"/>
  <ellipse cx="584" cy="410" rx="12" ry="16" fill="#264b61" stroke="#75b9d1" transform="rotate(28 584 410)"/>
  <ellipse cx="584" cy="410" rx="5" ry="7" fill="#102a3b" stroke="#4898c2" transform="rotate(28 584 410)"/>
  <path d="M584 424v18l-14 8m16-54v-22" stroke="#609ab8" stroke-width="4" stroke-linecap="round"/>
  <path d="m447 328 27-16 35 20-27 16Z" fill="#455361" stroke="#738391"/>
  <path d="M447 328v59l35 20v-59Z" fill="#202c37" stroke="#70808e"/>
  <path d="m482 348 27-16v59l-27 16Z" fill="#111d27" stroke="#586d7c"/>
  <path d="m455 342 18 10v14l-18-10Z" fill="#102635" stroke="#315c73"/>
  <path d="m459 350 10 6" stroke="#8ce0f4" stroke-width="1.5"/>
  <path d="m455 369 18 10m-18-5 11 6" stroke="#657987" stroke-width="1.2"/>
  <path d="M502 387v16l-16 9" stroke="#ddac60" stroke-width="2"/>

