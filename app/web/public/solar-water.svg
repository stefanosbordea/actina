  <ellipse cx="880" cy="428" rx="128" ry="74" fill="#070b10" opacity=".8"/>
  <path d="M756 416v10c0 40 55 73 124 73s124-33 124-73v-10" fill="#101d28" stroke="#365b70"/>
  <ellipse cx="880" cy="416" rx="124" ry="71" fill="#102535" stroke="#537b8e"/>
  <path d="M762 200v219c0 36 53 65 118 65s118-29 118-65V200" fill="url(#glass)" stroke="#5796b0" stroke-opacity=".62" stroke-width="1.2"/>
  <path d="M764 291v127c0 35 52 63 116 63s116-28 116-63V291" fill="url(#water)"/>
  <ellipse cx="880" cy="291" rx="116" ry="64" fill="#389dcc" fill-opacity=".15" stroke="#73dfff" stroke-opacity=".65" stroke-width="1.1"/>
  <path d="M779 306c18 22 57 37 101 37 43 0 82-15 101-37" stroke="#8bdeef" stroke-opacity=".25"/>
