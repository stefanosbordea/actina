    <path d="m202 373 70 40 104-60 98 57 41-24" stroke="url(#power)" stroke-width="2.4"/>
    <path d="m329 287 47 27v39M320 445l56-32v-60" stroke="#dfaa54" stroke-width="1.4" opacity=".65"/>
    <path d="m399 495 76-44 50 29 45-26" stroke="#2c8df4" stroke-width="11" opacity=".075"/>
    <path d="m399 495 76-44 50 29 45-26" stroke="url(#pipe)" stroke-width="3.5"/>
    <path d="m681 399 73 42 75-43" stroke="#279fff" stroke-width="13" opacity=".075"/>
    <path d="m681 399 73 42 75-43" stroke="url(#pipe)" stroke-width="4.5"/>
    <path d="m683 395 71 41 71-41" stroke="#a1edff" stroke-width="1" opacity=".55"/>
    <path d="m994 412 61 35-62 36" stroke="url(#pipe)" stroke-width="3.5"/>
  </g>

