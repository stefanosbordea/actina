  <path d="M763 364c0 36 52 65 117 65s117-29 117-65" stroke="#4aafd5" stroke-opacity=".16"/>
  <path d="M763 418c0 36 52 65 117 65s117-29 117-65" stroke="#68c7e8" stroke-opacity=".62"/>
  <ellipse cx="880" cy="200" rx="118" ry="66" fill="#0e1a23" fill-opacity=".65" stroke="url(#rim)" stroke-width="2.3"/>
  <ellipse cx="880" cy="200" rx="108" ry="58" stroke="#68b3ce" stroke-opacity=".22"/>
  <path d="M768 217v195M991 217v194" stroke="#a0dded" stroke-opacity=".2" stroke-width="2"/>
  <path d="M790 243v186m9-181v174" stroke="#8cddf4" stroke-opacity=".11" stroke-width="3"/>
  <path d="M962 246v185" stroke="#8ee6ff" stroke-opacity=".22" stroke-width="1.5"/>
  <path d="M762 200c0 36 53 66 118 66s118-30 118-66" stroke="#8dd3e7" stroke-opacity=".68" stroke-width="1.1"/>
  <path d="M762 204c0 36 53 66 118 66s118-30 118-66" stroke="#244b61" stroke-width="2"/>
  <path d="m751 438 20-12v-40" stroke="#60c4eb" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
