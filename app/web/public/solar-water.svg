<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Solar power becomes stored drinking water</title>
  <desc id="desc">An isometric solar array feeds a compact desalination module, connected by illuminated blue pipes to a translucent water reservoir.</desc>
  <defs>
    <linearGradient id="cell" x1="0" y1="0" x2="180" y2="126" gradientUnits="userSpaceOnUse">
      <stop stop-color="#132338"/><stop offset=".48" stop-color="#0d1726"/><stop offset="1" stop-color="#1a3348"/>
    </linearGradient>
    <linearGradient id="cellSheen" x1="0" y1="0" x2="180" y2="126" gradientUnits="userSpaceOnUse">
      <stop stop-color="#76c8ee" stop-opacity=".2"/><stop offset=".5" stop-color="#93d5ef" stop-opacity="0"/><stop offset="1" stop-color="#4781a2" stop-opacity=".13"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="-14" x2="0" y2="14" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9cabb7"/><stop offset=".18" stop-color="#c2d1d7"/><stop offset=".36" stop-color="#576673"/><stop offset=".7" stop-color="#25323e"/><stop offset="1" stop-color="#667886"/>
    </linearGradient>
    <linearGradient id="base" x1="486" y1="372" x2="689" y2="468" gradientUnits="userSpaceOnUse">
      <stop stop-color="#252c35"/><stop offset="1" stop-color="#141b23"/>
    </linearGradient>
    <linearGradient id="power" x1="280" y1="300" x2="518" y2="378" gradientUnits="userSpaceOnUse">
      <stop stop-color="#db902b"/><stop offset=".55" stop-color="#ffc96b"/><stop offset="1" stop-color="#faf0c0"/>
    </linearGradient>
    <linearGradient id="pipe" x1="421" y1="460" x2="1050" y2="428" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1455a6"/><stop offset=".4" stop-color="#298cfa"/><stop offset=".7" stop-color="#70e8ff"/><stop offset="1" stop-color="#2587b8"/>
    </linearGradient>
    <linearGradient id="glass" x1="762" y1="298" x2="998" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#46c3f4" stop-opacity=".16"/><stop offset=".2" stop-color="#5ac9f2" stop-opacity=".035"/><stop offset=".64" stop-color="#3eabda" stop-opacity=".055"/><stop offset=".89" stop-color="#93e9ff" stop-opacity=".16"/><stop offset="1" stop-color="#3a9bc2" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="water" x1="880" y1="273" x2="880" y2="486" gradientUnits="userSpaceOnUse">
      <stop stop-color="#53d8ff" stop-opacity=".2"/><stop offset=".5" stop-color="#1489d1" stop-opacity=".2"/><stop offset="1" stop-color="#0d3864" stop-opacity=".58"/>
    </linearGradient>
    <linearGradient id="rim" x1="757" y1="186" x2="1002" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5597ae"/><stop offset=".46" stop-color="#b6edff"/><stop offset="1" stop-color="#326178"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop stop-color="#ffc96b" stop-opacity=".18"/><stop offset=".45" stop-color="#ffc96b" stop-opacity=".055"/><stop offset="1" stop-color="#ffc96b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="waterGlow">
      <stop stop-color="#218dda" stop-opacity=".1"/><stop offset="1" stop-color="#218dda" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun" x1="142" y1="80" x2="179" y2="115" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffe2a0"/><stop offset="1" stop-color="#d68b26"/>
    </linearGradient>
    <g id="solarPanel">
      <path d="M69 50V91M195-22V23M69 77 195 5" stroke="#536370" stroke-width="3"/>
      <path d="m55 100 28-16m98-53 28-16" stroke="#76828d" stroke-width="3"/>
      <path d="M0 0v5l69 50 126-72v-5L69 50Z" fill="#263444" stroke="#778894" stroke-width=".8"/>
      <g transform="matrix(.7 -.4 .55 .4 0 0)">
        <rect width="180" height="126" rx="2" fill="#6e8a9b"/>
        <rect x="3" y="3" width="174" height="120" fill="url(#cell)"/>
        <path d="M32 3v120M61 3v120M90 3v120M119 3v120M148 3v120M3 33h174M3 63h174M3 93h174" stroke="#4a7695" stroke-width="1.15"/>
        <path d="M6 17h168M6 48h168M6 78h168M6 108h168" stroke="#366783" stroke-width=".6" opacity=".65"/>
        <path d="M3 3h174v120H3Z" fill="url(#cellSheen)"/>
        <path d="M4 4h172M4 4v118" stroke="#aad1df" stroke-width="1.2" opacity=".7"/>
      </g>
    </g>
    <g id="membrane">
      <rect x="0" y="-13" width="130" height="26" rx="11" fill="url(#metal)" stroke="#94a9b5" stroke-width=".8"/>
      <path d="M13-12v24M109-12v24" stroke="#263947" stroke-width="4"/>
      <path d="M15-11v22M111-11v22" stroke="#8a9daa" stroke-width="1"/>
      <path d="M21-8h80" stroke="#e0f0f5" stroke-width="1.2" opacity=".55"/>
      <ellipse cx="128" cy="0" rx="7" ry="12" fill="#263b48" stroke="#a7c1cb"/>
      <ellipse cx="128" cy="0" rx="3.5" ry="6.5" fill="#122a39" stroke="#46a9d3"/>
      <path d="M129 0h10" stroke="#5fc3e6" stroke-width="4"/>
    </g>
  </defs>

  <ellipse cx="864" cy="388" rx="235" ry="194" fill="url(#waterGlow)"/>
  <ellipse cx="168" cy="111" rx="125" ry="110" fill="url(#sunGlow)"/>

  <!-- Ground plane and the two physical connections. -->
  <g stroke="#a6bccb" stroke-opacity=".065" stroke-width="1">
    <path d="m38 428 248 143 764-442M90 458 764 68M218 532 951 109M378 573 688 394M59 350l392 226M165 289l440 254M323 198l725 419M475 110l568 328"/>
