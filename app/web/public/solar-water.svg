  <path d="M771 387v33" stroke="#77dfff" stroke-width="3"/>
  <ellipse cx="1000" cy="415" rx="7" ry="10" fill="#14374a" stroke="#60b7d6" transform="rotate(28 1000 415)"/>

  <g fill="#96e5fa">
    <circle cx="754" cy="441" r="3"/>
    <circle cx="399" cy="495" r="2.5" opacity=".75"/>
  </g>
  <circle cx="376" cy="353" r="2.5" fill="#ffce77"/>
</svg>
