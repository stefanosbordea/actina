name: Verify release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: app/requirements-replay.txt
      - name: Install pinned model replay dependencies
        run: |
          python -m pip install --only-binary=:all: --disable-pip-version-check -r app/requirements-replay.txt
          python -m pip check
      - name: Install locked dependencies and verify
        run: python app/scripts/verify_release.py --install --output app/build/release-check
      - name: Verify retained model demo
        run: |
          python -m unittest discover -s app/tools -p "test_*.py" -v
          python -m unittest discover -s app/tests -p test_review_pack.py -v
          python app/experiments/f1-001/check_audit.py
          python -m unittest discover -s app/experiments/prospective-001 -p test_capture.py -v
          python -m unittest discover -s app/experiments/prospective-001/evaluation -p test_evaluate.py -v
          python -m unittest discover -s app/experiments/reference-sensitivity-001 -p test_check.py -v
          python app/experiments/reference-sensitivity-001/review.py
          python app/experiments/f1-005/review/check.py
          python app/experiments/f1-006/review/check.py
          python app/experiments/f1-006/review/replay_models.py
          python app/experiments/nwp-alternative-001/review/check.py
          python app/experiments/f1-007/review/check.py
          python -m unittest discover -s app/experiments/f1-008 -p test_policy.py -v
          python -m unittest discover -s app/experiments/f1-008/review -p test_replay.py -v
          python -c "import json, runpy; from pathlib import Path; audit = runpy.run_path('app/experiments/f1-008/review/check.py'); result = audit['check'](); Path('app/build/release-check/model008-replay.json').write_text(json.dumps(result, indent=2)); print(json.dumps(result))"
          python -c "import json, runpy; audit = runpy.run_path('app/experiments/f1-006/check.py'); print(json.dumps(audit['main']()))"
          python -c "import json, runpy; audit = runpy.run_path('app/experiments/f1-005/review/paired-bootstrap-review.py'); print(json.dumps(audit['main']()['checks']))"
          node app/tools/test_demo.mjs
          node app/tools/test_benchmark_ui.mjs
          node app/build.mjs
      - name: Replay saved neural and daily forecasts
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest discover -s app/experiments/f1-009 -p test_bqn.py -v
          python -m unittest discover -s app/experiments/f1-009/review -p test_replay.py -v
          python -m unittest discover -s app/experiments/f1-010 -p test_policy.py -v
          python -m unittest discover -s app/experiments/f1-010/review -p test_portable.py -v
          python - <<'PY'
          import json
          from pathlib import Path
          import runpy
          audit = runpy.run_path('app/experiments/f1-009/review/check.py')
          result = audit['check']()
          Path('app/build/release-check/model009-replay.json').write_text(json.dumps(result, indent=2))
          print(json.dumps(result))
          sensitivity = runpy.run_path('app/experiments/f1-009/review/test_uncertainty_path.py')['replay_and_compare']()
          Path('app/build/release-check/model009-uncertainty-replay.json').write_text(json.dumps(sensitivity, indent=2))
          print('Paired day-block uncertainty replay PASS')
          paired = runpy.run_path('app/experiments/f1-010/review/portable.py')['main']()
          Path('app/build/release-check/model010-replay.json').write_text(json.dumps(paired, indent=2))
          print(json.dumps(paired))
          PY
      - name: Check water-scheduling fixtures and retained evidence
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest discover -s app/experiments/physical-011 -p test_optimizer.py -v
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import runpy
          experiment = Path('app/experiments/physical-011')
          checked = 0
          for base, manifest in [(Path('.'), experiment / 'inputs.json'),
                                 (experiment / 'result', experiment / 'result/outputs.json')]:
              for name, digest in json.loads(manifest.read_text()).items():
                  assert hashlib.sha256((base / name).read_bytes()).hexdigest() == digest, name
                  checked += 1
          fixtures = runpy.run_path(str(experiment / 'headroom/check.py'))['fixtures']()
          weighted = runpy.run_path(str(experiment / 'uncertainty/check.py'))['fixtures']()
          result = dict(status='PASS', retained_file_hashes=checked,
                        perfect_information_fixtures=fixtures, weighted_tail_fixtures=weighted,
                        scope='Analytical fixtures and retained evidence identity, not a new historical run.')
          Path('app/build/release-check/physical011-fixtures.json').write_text(json.dumps(result, indent=2))
          print(json.dumps(result))
          PY
      - name: Check conditional-scenario fixtures and retained evidence
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python app/experiments/physical-012/test_retrieval.py
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          experiment = Path('app/experiments/physical-012')
          checked = 0
          for base, manifest in [(Path('.'), experiment / 'inputs.json'),
                                 (experiment / 'result', experiment / 'result/outputs.json')]:
              for name, digest in json.loads(manifest.read_text()).items():
                  assert hashlib.sha256((base / name).read_bytes()).hexdigest() == digest, name
                  checked += 1
          result = dict(status='PASS', retained_file_hashes=checked,
                        scope='Retrieval fixtures and retained evidence identity, not a new historical run.')
          Path('app/build/release-check/physical012-fixtures.json').write_text(json.dumps(result, indent=2))
          print(json.dumps(result))
          PY
      - name: Check exact event decisions and retained evidence
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest discover -s app/experiments/f1-013 -p 'test_*.py' -v
          python -m unittest discover -s app/experiments/f1-013/uncertainty -p 'test_*.py' -v
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          experiment = Path('app/experiments/f1-013')
          checked = 0
          manifests = [(Path('.'), experiment / 'inputs.json'),
                       (experiment / 'result', experiment / 'result/outputs.json'),
                       (experiment, experiment / 'uncertainty/result/inputs.json'),
                       (experiment / 'uncertainty/result', experiment / 'uncertainty/result/outputs.json')]
          for base, manifest in manifests:
              for name, digest in json.loads(manifest.read_text()).items():
                  assert hashlib.sha256((base / name).read_bytes()).hexdigest() == digest, name
                  checked += 1
          result = dict(status='PASS', retained_file_hashes=checked,
                        scope='Exact-decision and resampling fixtures plus retained evidence identity, not a new historical run.')
          Path('app/build/release-check/model013-fixtures.json').write_text(json.dumps(result, indent=2))
          print(json.dumps(result))
          PY
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/release-check
          if-no-files-found: warn
          retention-days: 30
