name: Verify release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: app/requirements-replay.txt
      - name: Install pinned model replay dependencies
        run: |
          python -m pip install --only-binary=:all: --disable-pip-version-check -r app/requirements-replay.txt
          python -m pip check
      - name: Install locked dependencies and verify
        run: python app/scripts/verify_release.py --install --output app/build/release-check
      - name: Verify retained model demo
        run: |
          python -m unittest discover -s app/tools -p "test_*.py" -v
          python -m unittest discover -s app/tests -p test_review_pack.py -v
          python app/experiments/f1-001/check_audit.py
          python -m unittest discover -s app/experiments/prospective-001 -p test_capture.py -v
          python -m unittest discover -s app/experiments/prospective-001/evaluation -p test_evaluate.py -v
          python -m unittest discover -s app/experiments/reference-sensitivity-001 -p test_check.py -v
          python app/experiments/reference-sensitivity-001/review.py
          python app/experiments/f1-005/review/check.py
          python app/experiments/f1-006/review/check.py
          python app/experiments/f1-006/review/replay_models.py
          python app/experiments/nwp-alternative-001/review/check.py
          python app/experiments/f1-007/review/check.py
          python -m unittest discover -s app/experiments/f1-008 -p test_policy.py -v
          python -m unittest discover -s app/experiments/f1-008/review -p test_replay.py -v
          python -c "import json, runpy; from pathlib import Path; audit = runpy.run_path('app/experiments/f1-008/review/check.py'); result = audit['check'](); Path('app/build/release-check/model008-replay.json').write_text(json.dumps(result, indent=2)); print(json.dumps(result))"
          python -c "import json, runpy; audit = runpy.run_path('app/experiments/f1-006/check.py'); print(json.dumps(audit['main']()))"
          python -c "import json, runpy; audit = runpy.run_path('app/experiments/f1-005/review/paired-bootstrap-review.py'); print(json.dumps(audit['main']()['checks']))"
          node app/tools/test_demo.mjs
          node app/tools/test_benchmark_ui.mjs
          node app/build.mjs
      - name: Replay saved Bernstein quantile networks
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest discover -s app/experiments/f1-009 -p test_bqn.py -v
          python -m unittest discover -s app/experiments/f1-009/review -p test_replay.py -v
          python - <<'PY'
          import json
          from pathlib import Path
          import runpy
          audit = runpy.run_path('app/experiments/f1-009/review/check.py')
          result = audit['check']()
          Path('app/build/release-check/model009-replay.json').write_text(json.dumps(result, indent=2))
          print(json.dumps(result))
          sensitivity = runpy.run_path('app/experiments/f1-009/review/uncertainty.py')['main']()
          saved = json.loads(Path('app/experiments/f1-009/review/uncertainty-result.json').read_text())
          assert sensitivity == saved
          print('Paired day-block uncertainty replay PASS')
          PY
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/release-check
          if-no-files-found: warn
          retention-days: 30
